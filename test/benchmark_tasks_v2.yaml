# SimSkill efficacy benchmark V2 — fixed, held-out hard-task suite.
#
# This suite is an experimental instrument. It must not be used for memory ingestion or
# curriculum generation. Any post-freeze edit must bump suite_meta.version and record the
# change in version_history.
#
# Schema per task:
#   id:                 unique across benchmark versions; V2 ids end in -V2
#   category:           one of the 10 practice/research domains listed below
#   tier:               3 (multi-step composition) or 4 (novel core capability)
#   sumo_run_budget:    evaluator metadata: the size of the measurement design the task text
#                       prescribes (screens, factorial cells, seeds, stress and validation
#                       runs), verified to be at most 20. It bounds the problem, not the
#                       solver: development and debugging simulations are unrestricted and
#                       uncounted, and solution wall-clock time is scored separately, so
#                       wasteful simulation is self-penalizing
#   task:               the complete prompt given to the action agent
#   input_files:         optional raw, tool-agnostic data under
#                        test/benchmark_tasks_files/<task-id>/
#   related_skills:      evaluator-only relevance labels; never task dependencies or callable
#                        libraries, and never exposed as instructions inside task text
#   related_knowledge:   semantic-memory pages expected to support a Tier 3 solution
#
# Tier rules:
#   Tier 3 requires several coupled modeling, control, validation, and analysis steps. No
#   Tier 3 task can be solved by replaying one procedural-memory skill unchanged.
#   Tier 4 has a decisive facility, inference method, policy objective, or research method
#   that is absent from the frozen procedural and semantic memory. Its related-memory lists
#   are intentionally empty even when generic SUMO mechanics remain useful.
# Every task is standalone: a named Simulation of Urban MObility (SUMO) executable or
# SUMO-distributed script is identified as
# such, while every other controller, inference method, policy, or analysis must be implemented
# by the solver from the specification. A task may not assume procedural-memory scripts, assets,
# helper modules, or prior artifacts exist. Each task prescribes its measurement design —
# which scenarios, controllers, screens, and seeds to simulate — sized so no design exceeds 20
# independently simulated scenario/controller/seed runs. A separately simulated copy counts as
# one design run even if automation could bundle copies into one process; preprocessing that
# does not invoke sumo or sumo-gui and offline analysis are not design runs. The design size
# bounds the problem to solve, not the solver's process: debugging and development simulations
# are unrestricted and uncounted, and because total solution time is a scored performance
# index, solvers should work as quickly as possible.
#
# Categories: network-design; demand-inference; signal-control; freeway-operations;
# multimodal-transit; safety-human-factors; environment-energy; freight-curb-operations;
# planning-policy-equity; simulation-methods.
#
# Naming convention:
#   <category>-<tier>-<task_number_in_category>-V2
# Task numbers increase sequentially from 1 to 4 within each category, independent of tier.
# Example: NG-T3-1-V2, NG-T3-2-V2, NG-T4-3-V2, NG-T4-4-V2.


suite_meta:
  version: "2.7.0"
  frozen: true
  frozen_at: "2026-08-12"
  memory_snapshot_at_freeze:
    procedural_skill_count: 146
    semantic_page_count: 147
  task_count: 40
  tier_counts:
    3: 20
    4: 20
  input_backed_task_count: 10
  max_sumo_runs_per_task: 20
  max_random_seeds_per_design_cell: 5
  notes: >-
    V2 contains only hard tasks. Tier 3 measures compositional reuse; Tier 4 measures
    first-principles generalization beyond the memory snapshot. Prompts specify geometry,
    demand, treatments, replications, outcomes, and validity checks so independent solvers
    address the same problem. Task prompts are standalone and never treat procedural-memory
    material as a library. Each prompt prescribes an explicit measurement design of no more
    than 20 independently simulated scenario/controller/seed runs; task text states the design
    itself rather than a run budget, and solver development or debugging simulation is
    unrestricted because solution time is scored separately.
  version_history:
    - version: "0.1.0"
      date: "2026-08-04"
      change: "Initial freeze inherited from the first hardening pass."
    - version: "0.3.0"
      date: "2026-08-10"
      change: >-
        Strengthened the original Tier 3 and Tier 4 tasks after pilot ceiling effects.
    - version: "1.0.0"
      date: "2026-08-10"
      change: >-
        Added V2-suffixed task ids and refreshed the recorded memory snapshot.
    - version: "2.0.0"
      date: "2026-08-12"
      change: >-
        Removed all Tier 1 and Tier 2 tasks; rebuilt the suite as 20 Tier 3 and 20 Tier 4
        tasks; expanded to 10 practice/research domains; made Tier 4 novelty strict against
        the updated memory; and added raw supporting data for 10 tasks.
    - version: "2.0.1"
      date: "2026-08-12"
      change: >-
        Normalized every id to <category>-<tier>-<task_number>-V2 with task numbers 1-4
        increasing sequentially within each category; renamed matching input directories.
    - version: "2.1.0"
      date: "2026-08-12"
      change: >-
        Audited all input-backed tasks and corrected data-design defects: meaningful parallel
        route alternatives, explicit observation periods, usable episodic policy logs,
        imbalanced scooter demand, separate collision/injury transfer tables, receptor
        backgrounds, precise freight topology, and implementable multimodal project inputs.
    - version: "2.2.0"
      date: "2026-08-12"
      change: >-
        Added an inline data dictionary and row-level interpretation to every input-backed
        task; defined holdout, uncertainty, privacy, and identifier semantics; and removed
        remaining geometry, demand, service-window, group, and experimental-design ambiguity
